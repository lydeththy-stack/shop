<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product Manager</title>
<style>
:root{
  --bg:#f3f5f2; --surface:#ffffff; --text:#1d2a24; --muted:#5f6e66; --line:#d5dcd7;
  --accent:#1f6f5c; --accent-text:#ffffff; --danger:#b3372f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a17; --surface:#1d2521; --text:#e7eee9; --muted:#9aa9a1; --line:#2e3a34;
    --accent:#4fb99c; --accent-text:#0e1613; --danger:#ef8a82; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1d2521; --text:#e7eee9; --muted:#9aa9a1; --line:#2e3a34;
  --accent:#4fb99c; --accent-text:#0e1613; --danger:#ef8a82; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:4px}
input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);min-width:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:9px 16px}
.add{background:var(--accent);color:var(--accent-text);align-self:end;font-weight:600}
.err{color:var(--danger);font-size:.9rem;min-height:1.3em;margin:8px 2px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;color:var(--muted);font-size:.9rem;gap:10px}
.bar input{max-width:200px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.name{font-weight:600;overflow-wrap:anywhere}
.num{color:var(--muted)}
.rm{background:transparent;color:var(--danger);border:1px solid var(--line)}
.act{display:flex;gap:8px}
.rm:disabled{opacity:.7;cursor:default}
.hist-title{font-size:1.1rem;margin:28px 0 8px}
.admin{display:flex;align-items:center;gap:10px;margin:0 0 14px;color:var(--muted);font-size:.9rem}
.loginbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.loginbox[hidden]{display:none}
#f[hidden]{display:none}
.savebar{margin:12px 0;display:flex;gap:10px;align-items:center}
.savebar[hidden]{display:none}
.sell{background:var(--accent);color:var(--accent-text);font-weight:600}
.sell:disabled{opacity:.4;cursor:not-allowed}
.rm:hover{border-color:var(--danger)}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
@media (max-width:600px){
  form{grid-template-columns:1fr 1fr}
  form label:first-child{grid-column:1/-1}
  .add{grid-column:1/-1}
  .row{grid-template-columns:1fr auto}
  .row .num{grid-column:1}
}
</style>
</head>
<body>
<main>
  <h1>Products</h1>
  <p class="sub">Staff can sell products and save sales. Only the admin can add or remove products, undo sales and see the daily summary.</p>
  <div class="admin"><span id="role">Staff mode</span><button id="adminBtn" type="button" class="rm">Admin login</button></div>
  <div id="login" class="loginbox" hidden>
    <input id="pw" type="password" aria-label="Admin password" autocomplete="off">
    <button id="pwGo" type="button" class="add">Log in</button>
    <span id="pwMsg" class="err" role="alert"></span>
  </div>

  <form id="f">
    <label>Product name<input id="name" required maxlength="80" autocomplete="off"></label>
    <label>Price<input id="price" type="number" min="0" step="0.01" required></label>
    <label>Quantity<input id="qty" type="number" min="0" step="1" required></label>
    <button class="add" type="submit">Add product</button>
  </form>
  <div class="err" id="err" role="alert"></div>

  <div class="bar">
    <span id="count"></span>
    <input id="q" type="search" placeholder="Search products" aria-label="Search products">
  </div>
  <div class="list" id="list"></div>
  <div id="dailyWrap" hidden>
    <h2 class="hist-title">Daily summary</h2>
    <div class="list" id="daily"></div>
  </div>
  <h2 class="hist-title">Sales history</h2>
  <div class="list" id="hist"></div>
  <div class="savebar" id="savebar">
    <button id="saveHist" type="button" class="add">Save to daily summary</button>
  </div>
</main>

<script>
var KEY = "products-v1";
var products = [];
var sales = { count: 0, revenue: 0, log: [], daily: {} };

function load(){
  try { var raw = localStorage.getItem(KEY); products = raw ? JSON.parse(raw) : []; }
  catch(e){ products = []; }
  if(!Array.isArray(products)) products = [];
  try { var s = JSON.parse(localStorage.getItem("sales-v1")); if(s && typeof s.revenue === "number") sales = s; } catch(e){}
  if(!Array.isArray(sales.log)) sales.log = [];
  if(!sales.daily || typeof sales.daily !== "object") sales.daily = {};
}
function saveSales(){
  try { localStorage.setItem("sales-v1", JSON.stringify(sales)); } catch(e){ showErr("Could not save sales."); }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(products)); return true; }
  catch(e){ showErr("Could not save. Browser storage is unavailable."); return false; }
}
function showErr(m){ document.getElementById("err").textContent = m; }

function dayKey(t){
  var d = new Date(t);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function renderDaily(){
  var box = document.getElementById("daily");
  box.innerHTML = "";
  var days = {}, order = [];
  Object.keys(sales.daily).forEach(function(k){
    var v = sales.daily[k];
    days[k] = { t: v.t, items: v.items, total: v.total }; order.push(k);
  });
  if(!order.length){
    var e = document.createElement("div"); e.className = "empty";
    e.textContent = "Nothing saved yet. When an admin saves the sales history, each day's total appears here.";
    box.appendChild(e); return;
  }
  order.sort().reverse();
  var today = dayKey(Date.now());
  order.forEach(function(k){
    var d = days[k];
    var r = document.createElement("div"); r.className = "row";
    var n = document.createElement("div"); n.className = "name";
    n.textContent = (k === today ? "Today, " : "") + new Date(d.t).toLocaleDateString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric" });
    var i = document.createElement("div"); i.className = "num"; i.textContent = d.items + (d.items === 1 ? " product sold" : " products sold");
    var p = document.createElement("div"); p.className = "num"; p.textContent = "$" + d.total.toFixed(2);
    r.appendChild(n); r.appendChild(i); r.appendChild(p);
    box.appendChild(r);
  });
}

function renderHistory(){
  var h = document.getElementById("hist");
  document.getElementById("savebar").hidden = false;
  document.getElementById("saveHist").disabled = !sales.log.length;
  h.innerHTML = "";
  if(!sales.log.length){
    var e = document.createElement("div"); e.className = "empty";
    e.textContent = "No sales yet. Each sale appears here, and you can undo it.";
    h.appendChild(e); return;
  }
  sales.log.forEach(function(entry){
    var r = document.createElement("div"); r.className = "row";
    var n = document.createElement("div"); n.className = "name"; n.textContent = entry.name;
    var pr = document.createElement("div"); pr.className = "num"; pr.textContent = "$" + entry.price.toFixed(2);
    var t = document.createElement("div"); t.className = "num"; t.textContent = new Date(entry.t).toLocaleString();
    var u = document.createElement("button"); u.className = "rm"; u.type = "button";
    u.textContent = "Undo sale"; u.setAttribute("aria-label", "Undo sale of " + entry.name);
    u.onclick = function(){
      if(!isAdmin) return;
      sales.log = sales.log.filter(function(x){ return x.id !== entry.id; });
      sales.count = Math.max(0, sales.count - 1);
      sales.revenue = Math.max(0, sales.revenue - entry.price);
      var prod = products.filter(function(p){ return p.id === entry.pid; })[0];
      if(prod) prod.qty += 1;
      save(); saveSales(); render();
    };
    r.appendChild(n); r.appendChild(pr); r.appendChild(t); if(isAdmin) r.appendChild(u);
    h.appendChild(r);
  });
}

function render(){
  renderDaily();
  renderHistory();
  var term = document.getElementById("q").value.trim().toLowerCase();
  var shown = products.filter(function(p){ return p.name.toLowerCase().indexOf(term) !== -1; });
  var list = document.getElementById("list");
  list.innerHTML = "";
  document.getElementById("count").textContent = products.length + (products.length === 1 ? " product" : " products") + " · " + sales.count + " sold · $" + sales.revenue.toFixed(2) + " revenue";
  if(!shown.length){
    var e = document.createElement("div");
    e.className = "empty";
    e.textContent = products.length ? "No products match your search." : (isAdmin ? "No products yet. Add your first one above." : "No products yet. Ask an admin to add products.");
    list.appendChild(e); return;
  }
  shown.forEach(function(p){
    var r = document.createElement("div"); r.className = "row";
    var n = document.createElement("div"); n.className = "name"; n.textContent = p.name;
    var pr = document.createElement("div"); pr.className = "num"; pr.textContent = "$" + Number(p.price).toFixed(2);
    var q = document.createElement("div"); q.className = "num"; q.textContent = "Qty " + p.qty;
    var act = document.createElement("div"); act.className = "act";
    var s = document.createElement("button"); s.className = "sell"; s.type = "button";
    s.textContent = p.qty > 0 ? "Sell 1" : "Sold out"; s.disabled = p.qty < 1;
    s.setAttribute("aria-label", "Sell one " + p.name);
    s.onclick = function(){
      if(p.qty < 1) return;
      p.qty -= 1; sales.count += 1; sales.revenue += Number(p.price);
      sales.log.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), pid: p.id, name: p.name, price: Number(p.price), t: Date.now() });
      save(); saveSales(); render();
    };
    var b = document.createElement("button"); b.className = "rm"; b.type = "button";
    b.textContent = "Remove"; b.setAttribute("aria-label", "Remove " + p.name);
    b.onclick = function(){
      if(!isAdmin) return;
      products = products.filter(function(x){ return x.id !== p.id; });
      save(); render();
    };
    act.appendChild(s); if(isAdmin) act.appendChild(b);
    r.appendChild(n); r.appendChild(pr); r.appendChild(q); r.appendChild(act);
    list.appendChild(r);
  });
}

document.getElementById("f").addEventListener("submit", function(ev){
  ev.preventDefault();
  if(!isAdmin) return;
  var name = document.getElementById("name").value.trim();
  var price = parseFloat(document.getElementById("price").value);
  var qty = parseInt(document.getElementById("qty").value, 10);
  if(!name){ showErr("Enter a product name."); return; }
  if(isNaN(price) || price < 0){ showErr("Enter a price of 0 or more."); return; }
  if(isNaN(qty) || qty < 0){ showErr("Enter a quantity of 0 or more."); return; }
  if(products.some(function(p){ return p.name.toLowerCase() === name.toLowerCase(); })){
    showErr("“" + name + "” is already in the list."); return;
  }
  showErr("");
  products.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), name: name, price: price, qty: qty });
  if(save()){ ev.target.reset(); document.getElementById("name").focus(); }
  render();
});
document.getElementById("q").addEventListener("input", render);

var isAdmin = false;
function sha(s){
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function(buf){
    return Array.from(new Uint8Array(buf)).map(function(x){ return x.toString(16).padStart(2,"0"); }).join("");
  });
}
var DEFAULT_HASH = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";
function storedHash(){ try { return localStorage.getItem("admin-hash-v1") || DEFAULT_HASH; } catch(e){ return DEFAULT_HASH; } }
function updateAdminUI(){
  document.getElementById("role").textContent = isAdmin ? "Admin mode" : "Staff mode";
  document.getElementById("adminBtn").textContent = isAdmin ? "Log out" : "Admin login";
  document.getElementById("login").hidden = true;
  document.getElementById("f").hidden = !isAdmin;
  document.getElementById("dailyWrap").hidden = !isAdmin;
  if(!isAdmin) showErr("");
  document.getElementById("pw").value = "";
  document.getElementById("pwMsg").textContent = "";
  render();
}
document.getElementById("adminBtn").addEventListener("click", function(){
  if(isAdmin){ isAdmin = false; updateAdminUI(); return; }
  var box = document.getElementById("login");
  box.hidden = !box.hidden;
  document.getElementById("pw").placeholder = storedHash() ? "Admin password" : "Create admin password (4+ characters)";
  if(!box.hidden) document.getElementById("pw").focus();
});
document.getElementById("pwGo").addEventListener("click", function(){
  var pw = document.getElementById("pw").value;
  var msg = document.getElementById("pwMsg");
  if(pw.length < 4){ msg.textContent = "Use at least 4 characters."; return; }
  sha(pw).then(function(h){
    var saved = storedHash();
    if(!saved){
      try { localStorage.setItem("admin-hash-v1", h); } catch(e){ msg.textContent = "Could not save the password."; return; }
      isAdmin = true; updateAdminUI();
    } else if(saved === h){ isAdmin = true; updateAdminUI(); }
    else { msg.textContent = "Wrong password."; }
  }).catch(function(){ msg.textContent = "Login is not supported in this browser."; });
});
document.getElementById("pw").addEventListener("keydown", function(e){ if(e.key === "Enter") document.getElementById("pwGo").click(); });

document.getElementById("saveHist").addEventListener("click", function(){
  if(!sales.log.length) return;
  sales.log.forEach(function(en){
    var k = dayKey(en.t);
    if(!sales.daily[k]) sales.daily[k] = { t: en.t, items: 0, total: 0 };
    sales.daily[k].items += 1; sales.daily[k].total += en.price;
  });
  sales.log = [];
  saveSales(); render();
});

load(); updateAdminUI();
</script>
</body>
</html>
